<!doctype html>
<html lang="en">
  <head>

    <title>Exam Practice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar__inner">
        <a class="brand" href="#/">
          <span class="brand__mark" aria-hidden="true">EP</span>
          <span class="brand__text">Exam Practice</span>
        </a>

        <nav class="topnav" aria-label="Primary">
          <a class="topnav__link" href="#/">Home</a>

      </div>

    <main class="container" id="app" aria-live="polite"></main>

        <span>Vanilla HTML/CSS/JS. Data loaded from <code>data/outsystems-techlead/exams.json</code>.</span>
        <span id="dataStatus" class="footer__status"></span>
